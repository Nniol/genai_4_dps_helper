[build-system]
requires = ["setuptools>=73.0","ibm_watsonx_ai==1.2.1","pandas==2.1.4","pymilvus==2.5.3","pydantic==2.10.5","pymupdf==1.25.2"]
build-backend = "setuptools.build_meta"
[project]
name = "genai_4_dps_helper"
version = "0.2.6"
authors = [
    { name="Benjamin A. Janes", email="benjamin.janes@se.ibm.com" },
]
description = "A common library for reusable and repeated code for the GenAI4DPS Training Courses."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Nniol/genai_4_dps_helper"
Issues = "https://github.com/Nniol/genai_4_dps_helper/issues"